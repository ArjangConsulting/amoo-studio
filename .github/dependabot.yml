version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    commit-message:
      prefix: deps
updates:
  - package-ecosystem: gradle
    directory: /
    labels:
      - dependencies
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
  - package-ecosystem: github-actions
    directory: /
    labels:
      - dependencies
      - ci
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
