name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dependabot auto-merge merges with the workflow token, and such merges never trigger push
  # workflows, so it dispatches CI on main itself.
  workflow_dispatch:

env:
  ORG_GRADLE_PROJECT_useLocalCodeEditor: "true"
  ORG_GRADLE_PROJECT_localCodeEditorPath: ${{ github.workspace }}/.ci/kmp-code-editor

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArjangConsulting/kmp-code-editor
          ref: 28790a500c93efc717acf03ab475f988e236087d
          path: .ci/kmp-code-editor
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :composeApp:desktopTest :composeApp:compileKotlinDesktop :composeApp:koverXmlReport :composeApp:koverVerify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: coverage-report
          path: composeApp/build/reports/kover/report.xml

  protocol-smoke:
    # Linux, not macOS: Amoo's macOS build links libswiftCompatibilitySpan.dylib from the OS, which the
    # macos-15 runner lacks, while the static Linux build runs anywhere and speaks the same protocol.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the latest verified Amoo release
        # The release tarball is what Studio embeds. Homebrew is avoided: its bottle relinking can
        # fail on runners for reasons unrelated to the protocol under test.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/amoo"
          mkdir -p "$dir"
          gh release download --repo ArjangConsulting/mobile-testing --pattern 'amoo-*-linux-static.tar.gz*' --dir "$dir"
          (cd "$dir" && sha256sum -c ./*.sha256 && tar -xzf ./amoo-*-linux-static.tar.gz)
          test -x "$dir/amoo"
      - name: Exercise the real studio protocol
        run: python3 scripts/studio-protocol-smoke.py --amoo "$RUNNER_TEMP/amoo/amoo"

  package-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArjangConsulting/kmp-code-editor
          ref: 28790a500c93efc717acf03ab475f988e236087d
          path: .ci/kmp-code-editor
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :composeApp:packageDmg :composeApp:packagePkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: macos-packaging-logs
          path: composeApp/build/compose/logs/
          if-no-files-found: ignore

  package-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArjangConsulting/kmp-code-editor
          ref: 28790a500c93efc717acf03ab475f988e236087d
          path: .ci/kmp-code-editor
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :composeApp:packageDeb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: linux-packaging-logs
          path: composeApp/build/compose/logs/
          if-no-files-found: ignore
