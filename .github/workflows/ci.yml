name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ORG_GRADLE_PROJECT_localCodeEditorPath: ${{ github.workspace }}/.ci/kmp-code-editor

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ArjangConsulting/kmp-code-editor
          ref: 41f3df4342ba278bcec9c614d02b5a0ed693bd1e
          path: .ci/kmp-code-editor
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :composeApp:desktopTest :composeApp:compileKotlinDesktop :composeApp:koverXmlReport :composeApp:koverVerify
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: coverage-report
          path: composeApp/build/reports/kover/report.xml

  package-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ArjangConsulting/kmp-code-editor
          ref: 41f3df4342ba278bcec9c614d02b5a0ed693bd1e
          path: .ci/kmp-code-editor
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :composeApp:packageDmg :composeApp:packagePkg
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: macos-packaging-logs
          path: composeApp/build/compose/logs/
          if-no-files-found: ignore

  package-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ArjangConsulting/kmp-code-editor
          ref: 41f3df4342ba278bcec9c614d02b5a0ed693bd1e
          path: .ci/kmp-code-editor
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :composeApp:packageDeb
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: linux-packaging-logs
          path: composeApp/build/compose/logs/
          if-no-files-found: ignore
