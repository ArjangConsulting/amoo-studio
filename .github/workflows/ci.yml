name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :composeApp:desktopTest :composeApp:compileKotlinDesktop :composeApp:koverXmlReport :composeApp:koverVerify
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: coverage-report
          path: composeApp/build/reports/kover/report.xml

  package-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :composeApp:packageDmg :composeApp:packagePkg
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-packaging-logs
          path: composeApp/build/compose/logs/
          if-no-files-found: ignore

  package-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :composeApp:packageDeb
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-packaging-logs
          path: composeApp/build/compose/logs/
          if-no-files-found: ignore
